<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <link rel="stylesheet" href="hacker.css">
</head>

<body>
    <main class="profile-card">
        <!-- Replace profile.jpg with your image file name. -->
        <img src="profile.jpg" alt="Your profile picture" class="avatar">

        <!-- Edit the text below to add your own details. -->
        <h1 class="name">Software Developer</p>
        <p class="bio">I'm a second year CSE student who enjoys turning thoughtful ideas into clean, useful digital experiences.</p>

        <div class="skills" aria-label="Skills">
            <span class="badge">HTML5</span>
            <span class="badge">CSS3</span>
            <span class="badge">JavaScript</span>
        </div>

        <div class="actions">
            <a href="mailto:you@example.com" class="btn btn-primary">Contact Me</a>
            <a href="https://github.com/" class="btn btn-secondary" target="_blank" rel="noreferrer">GitHub</a>
        </div>
    </main>
</body>

</html>
